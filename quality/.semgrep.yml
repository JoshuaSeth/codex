rules:
  - id: py-try-except-outside-edges
    message: "try/except is only allowed at explicit IO/API/UI/CLI edges; business logic should fail loudly."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          try:
            ...
          except ...:
            ...
      - pattern-not-inside: |
          @router.$METHOD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @router.$METHOD(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @app.$METHOD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @app.$METHOD(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @blueprint.route(...)
          def $F(...): ...
      - pattern-not-inside: |
          @blueprint.route(...)
          async def $F(...): ...
      - pattern-not-inside: |
          @click.command(...)
          def $F(...): ...
      - pattern-not-inside: |
          @app.command(...)
          def $F(...): ...
      - pattern-not-inside: |
          @typer.$CMD(...)
          def $F(...): ...
      - pattern-not-inside: |
          @celery.task(...)
          def $F(...): ...
      - pattern-not-inside: |
          @shared_task(...)
          def $F(...): ...
      - pattern-not-inside: |
          if __name__ == "__main__":
            ...
      - pattern-not-inside: |
          async def __call__(self, scope: starlette.types.Scope, receive: starlette.types.Receive, send: starlette.types.Send) -> ...:
            ...
            await self.app(scope, receive, send)
            ...
      - pattern-not-inside: |
          async def dispatch(self, $REQUEST: starlette.requests.Request, $NEXT: starlette.middleware.base.RequestResponseEndpoint) -> ...:
            ...
            await $NEXT($REQUEST)
            ...
      - pattern-not: |
          try:
            ...
            with httpx.Client(...) as $CLIENT:
              ...
            ...
          except ...:
            ...
      - pattern-not: |
          try:
            ...
            async with httpx.AsyncClient(...) as $CLIENT:
              ...
            ...
          except ...:
            ...
      - pattern-not: |
          try:
            ...
            async with aiohttp.ClientSession(...) as $CLIENT:
              ...
            ...
          except ...:
            ...
      - pattern-not: |
          try:
            ...
            with requests.Session(...) as $CLIENT:
              ...
            ...
          except ...:
            ...

  - id: forbid-requests-outside-infra
    message: "HTTP calls must go through an explicit infrastructure gateway."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: requests.$F(...)
                  - pattern: httpx.$F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(get|post|put|patch|delete|head|options|request|stream|session)$
          - patterns:
              - pattern: httpx.Client(...)
              - pattern-not-inside: |
                  with httpx.Client(...) as $CLIENT:
                    ...
          - patterns:
              - pattern: httpx.AsyncClient(...)
              - pattern-not-inside: |
                  async with httpx.AsyncClient(...) as $CLIENT:
                    ...
          - patterns:
              - pattern: requests.Session(...)
              - pattern-not-inside: |
                  with requests.Session(...) as $CLIENT:
                    ...
          - patterns:
              - pattern: aiohttp.ClientSession(...)
              - pattern-not-inside: |
                  async with aiohttp.ClientSession(...) as $CLIENT:
                    ...
          - pattern: aiohttp.request(...)
          - pattern: urllib.request.urlopen(...)
          - pattern: urllib.request.urlretrieve(...)
          - pattern: urllib3.PoolManager(...)
          - pattern: urllib3.ProxyManager(...)
          - pattern: urllib3.request(...)
          - pattern: socket.socket(...)
          - pattern: socket.create_connection(...)

  - id: forbid-aws-sdks-outside-infra
    message: "Cloud SDKs must be wrapped in an explicit infrastructure gateway."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: boto3.$F(...)
          - pattern: botocore.$F(...)
          - pattern: aiobotocore.$F(...)

  - id: no-handmade-paths
    message: "Build keys and paths through a naming abstraction in application/interface code."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: Path($X) / $Y
          - pattern: $P.mkdir(..., parents=$Z, ...)
          - pattern: os.path.join($X, $Y, ...)
          - pattern: f".../{...}/..."
          - pattern: $A + "/" + $B
          - pattern: '"/" + $X'
    paths:
      include:
        - "**/app/application/**"
        - "**/app/interfaces/**"
        - "**/src/*/application/**"
        - "**/src/*/interfaces/**"
